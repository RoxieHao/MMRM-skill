profile_version: standard-mmrm-profile/v1
study:
  study_id: STUDY-ID
execution:
  fail_fast: false
approval:
  review_file: studies/STUDY-ID/statistician-review/statistical-review.md
  review_sha256: REPLACE_WITH_64_HEX_SHA256
  analysis_plan_file: studies/STUDY-ID/statistician-review/analysis-plan.yaml
  analysis_plan_sha256: REPLACE_WITH_64_HEX_SHA256
  approval_payload_sha256: REPLACE_WITH_64_HEX_SHA256
  source_evidence_sha256: REPLACE_WITH_64_HEX_SHA256
  reviewed_by: REPLACE_WITH_REVIEWER
  approved_at_utc: 2026-01-01T00:00:00Z
analyses:
  - analysis_id: MMRM-01
    tfl_id: TFL-001
    title: Endpoint change from baseline by visit
    dataset:
      file: analysis.csv
      format: csv
      relative_path: studies/STUDY-ID/input/analysis.csv
      sha256: REPLACE_WITH_64_HEX_SHA256
    mappings:
      subject: SUBJECT_ID
      response: CHANGE_VALUE
      baseline: BASELINE_VALUE
      visit: VISIT_NUMBER
    derivations: []
    filters: []
    groups:
      - id: ENDPOINT-A
        label: Endpoint A
        predicates:
          - variable: PARAMCD
            operator: eq
            value: ENDPA
    endpoint_definitions:
      - group_id: ENDPOINT-A
        endpoint_variable: PARAMCD
        selected_codes: [ENDPA]
        selection_mode: single_code
        dimensions:
          instrument: {variable: not_applicable, values: []}
          version: {variable: not_applicable, values: []}
          reporter: {variable: not_applicable, values: []}
          subscale: {variable: not_applicable, values: []}
        row_allocation_rule: one_row_per_subject_endpoint_visit
    fixed_effects: [visit, baseline, baseline_by_visit]
    covariance:
      primary: UN
      fallback: [AR1, CS]
    df_method: Kenward-Roger
    estimands:
      visit_lsmeans: true
      treatment_visit_lsmeans: false
      pairwise_differences: false
    output:
      raw_file: MMRM-01_raw.csv
      final_file: MMRM-01_final.csv
